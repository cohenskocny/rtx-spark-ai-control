[package]
name = "rtx-spark-ai-control-v2"
version = "0.1.0"
description = "A GUI control center for a native Windows ARM64 vLLM installation"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTPS for the GitHub release check. The default features were off in Phase 2,
# when the only traffic was loopback HTTP. `native-tls` resolves to schannel here,
# which needs no C toolchain; ureq's `tls` feature pulls in `ring`, whose C/asm
# build step has no Windows ARM64 support without clang.
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
